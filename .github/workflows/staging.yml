name: CI & Deploy (staging)

# development -> staging    (morning-hub.rawendil-md2.usermd.net)
# master      -> production (morninghub.eu), see deploy.yml
#
# Both environments live on the SAME MyDevil account, in neighbouring
# directories. The deploy step must target DEPLOY_PATH_STAGING - pointing it at
# the production path would run `artisan migrate --force` against live data.

on:
  push:
    branches: [development]

concurrency:
  # Two pushes in a row must not overlap mid-build; queue them, don't cancel.
  group: deploy-staging
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare the application
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force

      - name: Build frontend assets
        run: npm run build

      - name: Run the quality gate
        run: composer ci

  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH_STAGING }}
            git fetch --all
            git reset --hard origin/development
            npm install
            npm run build
            php83 $(which composer) install --no-dev --optimize-autoloader
            php83 artisan optimize:clear
            php83 artisan migrate --force
            php83 artisan config:cache
            php83 artisan route:cache
