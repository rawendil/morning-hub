<svg width="40" height="42" viewBox="0 0 40 42" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Leaf outline (clock face) -->
    <path d="M20 2 C16 7 -3 30 20 40 C43 30 24 7 20 2Z" fill="#7c9082" stroke="#7c9082" stroke-width="1"/>
    <!-- Hour markers -->
    <circle cx="20" cy="8" r="1.3" fill="#fff"/>
    <circle cx="31" cy="24" r="1" fill="#fff"/>
    <circle cx="20" cy="36" r="1" fill="#fff"/>
    <circle cx="9" cy="24" r="1" fill="#fff"/>
    <!-- Minute hand -->
    <line x1="20" y1="23" x2="20" y2="11" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <!-- Hour hand -->
    <line x1="20" y1="23" x2="15" y2="30" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Center dot -->
    <circle cx="20" cy="23" r="2" fill="#fff"/>
</svg>
